name: Tests

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'docs/images/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'docs/images/**'
      - 'README.md'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Set up Node for frontend smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend test dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: npm ci

      - name: Install Playwright Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: npx playwright install chromium

      - name: Prepare pinned llama.cpp CPU binaries
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tarfile
          import urllib.request

          pin = json.loads(pathlib.Path("tests/llama-cpp-pin.json").read_text())
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "llama-flag-compatibility"
          destination.mkdir()
          archive = destination / pin["asset"]
          url = f'https://github.com/ggml-org/llama.cpp/releases/download/{pin["tag"]}/{pin["asset"]}'
          with urllib.request.urlopen(url, timeout=60) as response:
              archive.write_bytes(response.read())
          with archive.open("rb") as downloaded:
              digest = hashlib.file_digest(downloaded, "sha256").hexdigest()
          if digest != pin["sha256"]:
              raise SystemExit("Pinned llama.cpp archive SHA256 mismatch")
          with tarfile.open(archive) as bundle:
              bundle.extractall(destination, filter="data")
          binaries = list(destination.rglob("llama-server"))
          if len(binaries) != 1 or not binaries[0].with_name("llama-cli").is_file():
              raise SystemExit("Expected one directory containing llama-server and llama-cli")
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"LLAMA_GUI_LLAMA_BIN_DIR={binaries[0].parent}\n")
          print(f'Prepared llama.cpp {pin["tag"]}: {pin["asset"]}')
          PY

      - name: Run frontend tests with required flag compatibility
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: npm test
